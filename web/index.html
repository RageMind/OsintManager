<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSINT Manager</title><link rel="stylesheet" href="/web/style.css"><script defer src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script><script defer src="/web/app.js"></script><script defer src="/web/views.js"></script><script defer src="/web/handlers.js"></script></head><body>
<header><div class="brand"><span class="logo">OM</span><strong>OSINT Manager</strong></div><div class="header-right"><span id="connection">Offline</span><span class="pill" id="status">idle</span></div></header>
<div class="layout"><nav><button class="active" data-tab="dashboard">Дашборд</button><button data-tab="targets">Цели</button><button data-tab="profiles">Профили</button><button data-tab="graph">Граф</button><button data-tab="logs">Логи</button><button data-tab="game">Игра</button><button data-tab="settings">Настройки</button></nav><main>
<section class="panel active" id="dashboard"><h1>Дашборд</h1><div class="stats" id="stats"></div><article><h2>Задача</h2><div id="current-target"></div><progress id="progress" max="1" value="0"></progress><p id="uptime"></p><div class="buttons"><button class="primary" id="start-osint">Старт</button><button id="pause">Пауза</button><button id="resume">Продолжить</button><button class="danger" id="stop">Стоп</button></div></article></section>
<section class="panel" id="targets"><h1>Цели</h1><article><form class="toolbar" id="add-target"><input id="target-value" required placeholder="URL, название или публичный аккаунт"><button class="primary">Добавить</button></form><label class="dropzone" id="dropzone">Импорт targets.txt<input type="file" id="target-file" accept=".txt"></label><div class="toolbar"><button id="delete-selected">Удалить</button><button id="run-selected">Запустить одну</button><span id="target-count"></span></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="select-all"></th><th>Цель</th><th>Статус</th><th>Ошибка</th><th></th></tr></thead><tbody id="target-rows"></tbody></table></div></article></section>
<section class="panel" id="profiles"><h1>Профили</h1><div class="toolbar"><input id="profile-search" placeholder="Поиск"><select id="profile-filter"><option value="all">Все</option><option value="conflict">Конфликты</option></select><button id="export-json">JSON</button><button id="export-csv">CSV</button></div><div class="cards" id="profile-grid"></div><article hidden id="profile-detail"><button id="close-detail">Закрыть</button><pre id="profile-json"></pre><button id="single-json">JSON</button><button id="single-csv">CSV</button></article></section>
<section class="panel" id="graph"><h1>Граф</h1><article><div id="graph-canvas"></div></article></section>
<section class="panel" id="logs"><h1>Логи</h1><div class="toolbar"><select id="log-level"><option>ALL</option><option>DEBUG</option><option>INFO</option><option>WARN</option><option>ERROR</option></select><input id="log-search" placeholder="Поиск"><label><input type="checkbox" id="autoscroll" checked>Автоскролл</label><button id="download-logs">Скачать</button></div><article><div id="log-list" class="log-list"></div></article></section>
<section class="panel" id="game"><h1>Игра</h1><div class="buttons"><button id="game-start" class="primary">Старт</button><button id="game-pause">Пауза</button><button id="game-resume">Продолжить</button><button id="game-stop" class="danger">Стоп</button></div><article><img id="game-frame" alt="Кадр"><h2>Состояние</h2><pre id="game-state">{}</pre><h2>Решение</h2><pre id="game-decision">{}</pre></article></section>
<section class="panel" id="settings"><h1>Настройки</h1><form id="settings-form"><article><h2>.env</h2><div class="field-grid" id="env-fields"></div></article><article><h2>Промпты</h2><div id="prompt-fields"></div></article><button class="primary">Сохранить и перезагрузить</button></form></section>
</main></div><div id="toast" role="status"></div></body></html>
